<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transition Elements | 3D Glass Lab</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --cyan: #73f7ff;
  --purple: #b99aff;
  --glass: rgba(255,255,255,.075);
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at 15% 20%, #123c63 0%, transparent 40%),
    radial-gradient(ellipse at 85% 75%, #38205b 0%, transparent 40%),
    #050813;
  overflow-x: hidden;
}

header {
  text-align: center;
  padding: 28px 12px 12px;
}

header h1 {
  font-size: clamp(25px, 5vw, 48px);
  margin: 0;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #fff, #73f7ff, #b99aff);
  -webkit-background-clip: text;
  color: transparent;
}

header p {
  color: #a9bfdc;
  font-size: 13px;
  letter-spacing: 2px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px;
}

button {
  cursor: pointer;
  color: white;
  border: 1px solid #8aeaff55;
  background: rgba(125, 210, 255, .09);
  backdrop-filter: blur(12px);
  border-radius: 30px;
  padding: 10px 16px;
  transition: .25s;
}

button:hover {
  background: #58dfff30;
  border-color: var(--cyan);
  transform: translateY(-2px);
}

.scene {
  width: 100%;
  height: 440px;
  perspective: 1100px;
  overflow: hidden;
  touch-action: pan-y;
  display: flex;
  justify-content: center;
  align-items: center;
}

.table3d {
  position: relative;
  width: min(900px, 96vw);
  transform-style: preserve-3d;
  transform: rotateX(12deg) rotateY(-8deg);
  transition: transform .15s linear;
}

.series {
  margin: 20px 0;
  padding: 14px 10px;
  border: 1px solid #9beaff20;
  border-radius: 22px;
  background: linear-gradient(
    135deg,
    rgba(150,220,255,.075),
    rgba(180,140,255,.035)
  );
  backdrop-filter: blur(15px);
  box-shadow:
    inset 0 1px 1px #ffffff15,
    0 15px 45px #0005;
  transform-style: preserve-3d;
}

.series-title {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--cyan);
  margin: 0 0 14px 6px;
  text-transform: uppercase;
}

.elements {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 9px;
}

.element {
  aspect-ratio: 1 / 1;
  min-width: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  padding: 3px;
  background:
    radial-gradient(circle at 28% 20%,
      rgba(255,255,255,.4), transparent 35%),
    linear-gradient(145deg,
      rgba(103,239,255,.24),
      rgba(147,111,255,.14));
  border: 1px solid rgba(157,245,255,.55);
  box-shadow:
    inset 0 0 12px #ffffff12,
    0 0 13px #62dfff19,
    0 6px 12px #0005;
  backdrop-filter: blur(8px);
  transform: translateZ(15px);
  transition: transform .25s, box-shadow .25s;
  animation: float 4s ease-in-out infinite;
  animation-delay: calc(var(--i) * -.17s);
}

.element:hover,
.element:focus-visible {
  transform: translateZ(35px) scale(1.13);
  box-shadow: 0 0 24px #6af5ff75;
  outline: none;
  z-index: 3;
}

.element .number {
  font-size: clamp(7px, .9vw, 10px);
  color: #c5e8ff;
  align-self: flex-start;
  margin-left: 17%;
}

.element .symbol {
  font-size: clamp(13px, 2vw, 23px);
  font-weight: bold;
  color: white;
  text-shadow: 0 0 10px #70f4ff80;
}

.element .name {
  font-size: clamp(6px, .8vw, 9px);
  color: #c8d9f0;
}

@keyframes float {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -4px; }
}

#details {
  width: min(900px, 92%);
  margin: 10px auto 40px;
  padding: 24px;
  border: 1px solid #9aeaff50;
  border-radius: 25px;
  background: linear-gradient(
    135deg,
    rgba(113,221,255,.12),
    rgba(170,120,255,.09)
  );
  backdrop-filter: blur(22px);
  box-shadow: 0 0 45px #4adfff12, inset 0 1px #ffffff20;
}

.detail-head {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.big-symbol {
  width: 92px;
  height: 92px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 42px;
  font-weight: bold;
  border-radius: 24px;
  border: 1px solid #90f5ff80;
  background: linear-gradient(145deg, #70eaff30, #b28aff20);
  box-shadow: inset 0 0 20px #ffffff12, 0 0 25px #66eaff20;
}

#elementName {
  font-size: 27px;
  margin: 0 0 8px;
}

#elementMeta {
  color: #9eddf4;
  font-size: 13px;
}

.properties {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.property {
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #ffffff15;
  background: #ffffff08;
  overflow-wrap: anywhere;
}

.property small {
  display: block;
  color: #8db6d6;
  margin-bottom: 8px;
}

.property strong {
  font-size: 14px;
}

footer {
  text-align: center;
  padding: 10px 10px 25px;
  font-size: 11px;
  color: #6f8ba9;
}

@media(max-width: 650px) {
  .scene {
    height: 330px;
    perspective: 800px;
  }

  .table3d {
    width: 98vw;
  }

  .series {
    padding: 10px 5px;
    margin: 13px 0;
  }

  .elements {
    gap: 3px;
  }

  .element .name {
    display: none;
  }

  .element .number {
    margin-left: 10%;
  }

  .properties {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  #details {
    padding: 16px;
  }
}
</style>
</head>
